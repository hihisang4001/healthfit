<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>건강체력 증진 도우미</title>
<meta name="theme-color" content="#1F5FBF">
<link rel="preload" href="assets/fonts/BlackHanSans.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css?v=28">
<script src="js/vendor/html5-qrcode.min.js"></script>
</head>
<body>
<header class="topbar"><span class="brand">건강체력 증진 도우미</span><span id="net" class="net" role="status" aria-live="polite"></span><button type="button" id="mute" class="mute"></button><a href="cards.html">QR 카드</a><a href="teacher.html">교사용</a></header>
<main id="app">
  <section data-view="scan">
    <h1>QR 카드를 보여 주세요</h1>
    <p class="muted">앞 카메라에 내 카드를 대면 돼요.</p>
    <div id="reader"></div>
    <p class="error" id="scan-error" role="alert"></p>
    <button type="button" class="primary" id="cam-retry" hidden>카메라 다시 켜기</button>
  </section>

  <section data-view="loading" hidden aria-live="polite">
    <img class="load-img" src="assets/loading.png" alt="" width="200" height="200">
    <p class="load-text">학생 정보를 불러오는 중<span class="dots"><i>.</i><i>.</i><i>.</i></span></p>
    <p class="load-sub muted">잠깐만 기다려요!</p>
  </section>

  <section data-view="home" hidden>
    <div class="row"><h1 class="grow" id="hello"></h1><button class="ghost" id="logout">다른 친구</button></div>
    <div class="blocks"><button class="primary" id="go-record">기록하기</button><button id="go-mine">내 기록 보기</button></div>
  </section>

  <section data-view="record" hidden>
    <div class="row"><h2 class="grow" id="rec-title">오늘 측정한 항목을 골라요</h2><button class="ghost" data-back>뒤로</button></div>
    <div class="items" id="items"></div>
    <form id="form" class="card" hidden>
      <label id="value-label" for="value"></label>
      <div class="disp">
        <button type="button" id="minus" hidden aria-label="플러스 마이너스 바꾸기">±</button>
        <input id="value" readonly inputmode="none" autocomplete="off" aria-label="기록">
        <span id="unit"></span>
      </div>
      <p class="error" id="form-error" role="alert"></p>
      <div class="pad" id="pad"></div>
      <button class="primary" id="save">저장하기</button>
    </form>
  </section>

  <section data-view="result" hidden>
    <div class="card result" id="result"></div>
    <div class="blocks short"><button type="button" class="danger" id="undo">잘못 입력했어요</button><button id="to-start">처음으로 돌아가기</button></div>
  </section>

  <section data-view="mine" hidden>
    <div class="row"><h2 class="grow">내 기록</h2><button class="ghost" data-back>뒤로</button></div>
    <div class="mine" id="mine"></div>
  </section>
</main>
<div class="modal" id="confirm" role="alertdialog" aria-modal="true" aria-labelledby="confirm-msg" hidden>
  <div class="dlg">
    <p id="confirm-msg"></p>
    <div class="dlg-btns"><button type="button" id="confirm-no">다시 입력</button><button type="button" class="primary" id="confirm-yes">네, 맞아요</button></div>
  </div>
</div>
<div class="modal" id="undone" role="alertdialog" aria-modal="true" aria-labelledby="undone-msg" hidden>
  <div class="dlg">
    <button type="button" class="dlg-x" id="undone-close">닫기</button>
    <p id="undone-msg"></p>
    <div class="dlg-btns"><button type="button" class="primary" id="undone-again">다시 기록하기</button></div>
  </div>
</div>
<script type="module" src="js/student.js?v=28"></script>
<div class="ver-foot" id="ver"></div>
</body>
</html>
