<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>건강체력 증진 도우미 · 교사용</title>
<meta name="theme-color" content="#C4432B">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css?v=202611231600">
</head>
<body>
<header class="topbar"><span class="brand">건강체력 증진 도우미</span><a href="index.html">학생용</a></header>
<main id="app">
  <section data-view="login">
    <h1>교사용 화면</h1>
    <form id="login" class="card">
      <label for="pin">비밀번호</label>
      <input id="pin" type="password" autocomplete="off" inputmode="numeric">
      <p class="error" id="login-error" role="alert"></p>
      <button class="primary">들어가기</button>
    </form>
  </section>

  <section data-view="dash" hidden>
    <div class="row"><h1 class="grow">전체 현황</h1><button class="ghost" id="reload">새로 고침</button><button class="ghost" id="logout">나가기</button></div>
    <div class="card row">
      <label class="grow">학년<select id="f-grade"><option value="">전체</option><option>3</option><option>4</option><option>5</option><option>6</option></select></label>
      <label class="grow">성별<select id="f-sex"><option value="">전체</option><option>남</option><option>여</option></select></label>
      <label class="grow">분포 항목<select id="f-item"></select></label>
    </div>
    <div class="card"><h2>등급 분포</h2><div class="bars" id="bars"></div><div class="legend" id="legend"></div></div>
    <div class="card" style="overflow:auto"><table id="table"></table></div>
    <p class="error" id="dash-error" role="alert"></p>
  </section>

  <section data-view="student" hidden>
    <div class="row"><h1 class="grow" id="s-title"></h1><button class="ghost" id="s-back">목록으로</button></div>
    <form id="add" class="card row">
      <label>날짜<input type="date" id="a-date"></label>
      <label>항목<select id="a-item"></select></label>
      <label>기록<input id="a-value" inputmode="decimal" autocomplete="off"></label>
      <button class="primary">기록 추가</button>
    </form>
    <p class="error" id="s-error" role="alert"></p>
    <div class="card"><table id="s-table"></table></div>
  </section>
</main>
<script type="module" src="js/teacher.js?v=202611231600"></script>
</body>
</html>
