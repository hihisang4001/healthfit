<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>건강체력 증진 도우미 · 교사용</title>
<meta name="theme-color" content="#1F5FBF">
<link rel="preload" href="assets/fonts/BlackHanSans.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css?v=34">
</head>
<body>
<header class="topbar"><span class="brand">건강체력 증진 도우미</span><a href="cards.html">QR 카드</a><a href="index.html">학생용</a></header>
<main id="app">
  <section data-view="login">
    <h1>교사용 화면</h1>
    <form id="login" class="card">
      <label for="pin">비밀번호</label>
      <input id="pin" type="password" autocomplete="off" inputmode="none" readonly placeholder="눌러서 입력">
      <p class="error" id="login-error" role="alert"></p>
    </form>
  </section>

  <section data-view="guide" hidden>
    <div class="row"><h1 class="grow">검사방법 안내</h1><button class="ghost" id="guide-back">현황판으로</button></div>
    <div id="guide-box"></div>
  </section>

  <section data-view="dash" hidden>
    <div class="row"><h1 class="grow">전체 현황</h1><button class="ghost" id="open-guide">검사방법 안내</button><button class="ghost" id="reload">새로 고침</button><button class="ghost" id="logout">나가기</button></div>
    <div class="card banner" id="backup-banner" hidden><span>학기가 끝났어요. 구글 시트를 <b>사본 만들기</b>로 한 번 저장해 두세요.</span><button class="ghost" id="banner-close">확인했어요</button></div>
    <div class="card row">
      <label class="grow">학년<select id="f-grade"><option value="">전체</option><option>3</option><option>4</option><option>5</option><option>6</option></select></label>
    </div>
    <div class="card" style="overflow:auto"><table id="table"></table></div>
    <div class="card row"><span class="grow muted">새 학년이 되면 전체 학년을 한 칸씩 올립니다. 6학년은 졸업 처리되고 기록은 시트에 남습니다.</span><button class="danger" id="promote">학년 올리기</button></div>
    <p class="muted" id="prep-at" role="status"></p>
    <p class="muted" id="dash-note" role="status"></p>
    <p class="error" id="dash-error" role="alert"></p>
  </section>

  <section data-view="student" hidden>
    <div class="row"><h1 class="grow" id="s-title"></h1><button class="ghost" id="s-back">목록으로</button></div>
    <form id="add" class="card row">
      <label>날짜<input type="date" id="a-date"></label>
      <label>항목<select id="a-item"></select></label>
      <label>기록<input id="a-value" inputmode="decimal" autocomplete="off"></label>
      <button class="primary">기록 추가</button>
    </form>
    <p class="error" id="s-error" role="alert"></p>
    <div class="charts" id="charts"></div>
    <div class="card" style="overflow:auto"><table id="s-table"></table></div>
  </section>
</main>
<div class="modal" id="cell" role="dialog" aria-modal="true" aria-labelledby="cell-title" hidden>
  <div class="dlg cell-dlg">
    <button type="button" class="dlg-x" id="cell-close">닫기</button>
    <h2 id="cell-title"></h2>
    <label>날짜<input type="date" id="cell-date"></label>
    <div class="disp"><button type="button" id="cell-minus" hidden aria-label="플러스 마이너스 바꾸기">±</button><input id="cell-val" readonly inputmode="none" autocomplete="off" aria-label="기록"><span id="cell-unit"></span></div>
    <p class="muted" id="cell-note"></p>
    <div class="pad" id="cell-pad"></div>
    <p class="error" id="cell-error" role="alert"></p>
    <div class="cell-busy" id="cell-busy" role="status" aria-live="polite" hidden><div class="spinner" id="cell-spin"></div><p id="cell-busy-msg"></p></div>
    <div class="cell-btns"><button type="button" class="primary" id="cell-save">저장하기</button><button type="button" class="danger" id="cell-del" hidden>이 기록 지우기</button></div>
  </div>
</div>
<script type="module" src="js/teacher.js?v=34"></script>
<div class="ver-foot" id="ver"></div>
</body>
</html>
